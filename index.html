    <!-- SEO Meta Tags -->

    <meta name="keywords" content="Jason Guan, Full Stack Developer, Software Engineer, React, AWS, Python, Portfolio" />

    <meta property="og:type" content="website" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2E271F" />

    <!-- Apply saved/system theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
          if (theme === 'dark') {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.content = '#171210'
          }
        } catch (e) { /* storage blocked — default light */ }
      })()
    </script>
